<!DOCTYPE html>
<html lang="en">

<body>
    <table border="1" cellpadding="10" cellspacing="10">

            <td>1</td>
            <td>2</td>
            <td rowspan="3">3</td>

            <td colspan="2">4</td>
 
          </tr>
          <tr>
            <td>7</td>
            <td>8</td>
           
          </tr>
    </table>
    
    
</body>
