    <title>Table</title>
</head>
<body>
    <!-- 2*2 -->
    <table border="1" cellpadding="10" cellspacing="10">
          <tr>
            <td>1</td>
            <td>2</td>
          </tr>
          <tr>
            <td>3</td>
            <td>4</td>
          </tr>
    </table>
    <!-- 2*1 -->
     <table border="1" cellpadding="10" cellspacing="10">
        <tr>
            <td>1</td>
        </tr>
        <tr>
            <td>2</td>
        </tr>
     </table>
     <!-- 1*2 -->
    <table border="1" cellpadding="10" cellspacing="10">
       <tr>
        <td>1</td>
        <td>2</td>
       </tr>
       
    </table>
    
</body>
</html>
